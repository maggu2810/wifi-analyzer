# SPDX-License-Identifier: MIT
#
# Builds the signed release APK and publishes it as a GitHub Release
# (docs/decisions/0007-github-apk-distribution.md):
#   push to main          -> pre-release "android-nightly" (replaced on every push)
#   tag android-vX.Y.Z    -> release android-vX.Y.Z (marked "latest")
name: android

on:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write # create releases and the android-nightly tag

concurrency:
  # One nightly publish at a time; a newer push to main cancels an older one.
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  NDK_VERSION: 30.0.16248370 # keep in sync with ndkVersion in the Gradle files
  ANDROID_PLATFORM: android-37.0 # compileSdk
  BUILD_TOOLS: 37.0.0

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS" > /dev/null

      - name: Install CMake and Ninja
        # The SDK's default CMake is too old (CMakeLists need >= 3.31); cmake.dir must contain
        # bin/cmake and bin/ninja.
        run: |
          python -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet "cmake>=3.31,<5" ninja
          "$RUNNER_TEMP/cmake/bin/cmake" --version | head -1
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$RUNNER_TEMP/cmake" > local.properties

      - name: Determine version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          test -n "$name" && test -n "$code"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" != "android-v$name" ]]; then
              echo "::error::tag $tag does not match versionName $name"
              exit 1
            fi
            apk="wifi-analyzer-$name.apk"
          else
            tag=android-nightly
            apk="wifi-analyzer-$name-nightly-${GITHUB_SHA::7}.apk"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::secret ANDROID_KEYSTORE_BASE64 missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build and test
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # No configuration cache: it would serialize the signing passwords to disk.
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no signed APK produced"; exit 1; }
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$apk" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$apk" "$RUNNER_TEMP/dist/${{ steps.version.outputs.apk }}"
          (cd "$RUNNER_TEMP/dist" && sha256sum *.apk > SHA256SUMS)

      - name: Publish nightly pre-release
        if: steps.version.outputs.tag == 'android-nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA} – not a release."
            echo
            echo "versionName ${{ steps.version.outputs.name }}, versionCode ${{ steps.version.outputs.code }}."
            echo "Signed with the same key as the releases, so it installs over them and vice versa"
            echo "(Android refuses a lower versionCode)."
          } > "$RUNNER_TEMP/notes.md"
          gh release delete android-nightly --cleanup-tag --yes || true
          gh release create android-nightly --prerelease --target "$GITHUB_SHA" \
            --title "Android nightly (${GITHUB_SHA::7})" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/dist/*

      - name: Publish release
        if: steps.version.outputs.tag != 'android-nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name='${{ steps.version.outputs.name }}'
          # Notes: the matching section of the "Android app" part of CHANGELOG.md.
          awk -v v="$name" '
            /^## /  { app = ($0 ~ /^## Android app/) ; next }
            /^### / { if (app) { inside = (index($0, "### " v " ") == 1) } ; next }
            inside  { print }
          ' ../../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "Wi-Fi Analyzer $name (Android)" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/dist/*
